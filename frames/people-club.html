<!doctype html>
<html lang="ru">
<head><base href="../photos/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOJO — Живая игра</title>
  <link rel="stylesheet" href="people-campaign.css">
<style>#people-together{display:none!important}</style></head>
<body class="people-campaign-page">
  <main class="people-campaign">
    <article class="people-board people-club" id="people-club" data-title="Игра идет" data-width="1400" data-height="1800" aria-label="Игра идет — реальное фото гостей DOJO">
      <div class="club-photo-window"><img class="people-photo club-photo" src="selected/live-player.jpeg" alt="Гости DOJO во время игры"></div>
      <div class="club-shade" aria-hidden="true"></div>
      <div class="club-topline">
        <img class="people-logo club-logo" src="../brand/assets/logo-wordmark-red.svg" alt="DOJO">
        <span class="people-meta">КОМПЬЮТЕРНЫЙ КЛУБ<br>UNDER DOJO</span>
      </div>
      <h1 class="club-title">Игра<br>идет</h1>
      <div class="club-marker" aria-hidden="true"><i></i><span>LIVE / DOJO</span></div>
      <footer class="club-footer"><span>Собирайся в DOJO</span><span class="people-domain">dojo.wtf</span></footer>
    </article>

    <article class="people-board people-together" id="people-together" data-title="Собери своих" data-width="1920" data-height="1080" aria-label="Собери своих — имиджевая кампания DOJO со стоковой фотографией">
      <div class="together-photo-wrap"><img class="people-photo together-photo" alt="Друзья эмоционально реагируют во время игры на геймпадах"></div>
      <div class="together-paper" aria-hidden="true"></div>
      <div class="together-copy">
        <div class="people-meta together-kicker">DOJO / ИГРА ВМЕСТЕ</div>
        <h1 class="together-title">Собери<br>своих</h1>
        <div class="together-rule" aria-hidden="true"></div>
        <img class="people-logo together-logo" alt="DOJO">
        <span class="people-domain together-domain">dojo.wtf</span>
      </div>
    </article>
  </main>
  <script src="../frame-viewer.js"></script>
</body>
</html>
